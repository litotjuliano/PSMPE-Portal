name: Deploy (staging)

# Deploys to the Droplet whenever the staging branch is updated. Building happens on the
# Droplet itself (docker compose build), so this workflow only needs SSH access.

on:
  push:
    branches: [staging]
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            # Remember what is running now, so a deploy that never turns healthy can be undone.
            PREV=$(git rev-parse HEAD)
            git fetch origin staging
            git checkout staging
            git reset --hard origin/staging
            git fetch origin --tags --force
            export VITE_APP_VERSION=$(git describe --tags --always)
            DC="docker compose -p psmpe-staging -f docker-compose.yml -f docker-compose.ports.yml"
            if ! $DC up -d --build --wait --wait-timeout 240; then
              echo "::error::New version never became healthy - rolling back to $PREV"
              $DC logs --tail=60 backend || true
              git reset --hard "$PREV"
              export VITE_APP_VERSION=$(git describe --tags --always)
              $DC up -d --build --wait --wait-timeout 240
              echo "::error::Rolled back to $PREV (the failed deploy is NOT live)"
              exit 1
            fi
            docker image prune -f
