# Pinning the project name avoids Docker Compose deriving it from the current working
# directory (which changes depending on how/where `docker compose` is invoked from,
# e.g. run.bat vs a terminal cd'd elsewhere) and silently creating a *different*
# "pgdata" volume each time instead of reusing/removing the intended one.
name: psmpe-portal

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psmpe_portal}
      POSTGRES_USER: ${POSTGRES_USER:-psmpe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psmpe_user} -d ${POSTGRES_DB:-psmpe_portal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./src
      dockerfile: PSMPE.Portal.WebAPI/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Jwt__Key: ${Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer:-PSMPE.Portal}
      Jwt__Audience: ${Jwt__Audience:-PSMPE.Portal.Client}
      Jwt__ExpiryMinutes: ${Jwt__ExpiryMinutes:-60}
      Frontend__BaseUrl: ${Frontend__BaseUrl:-http://localhost:5173}
      Smtp__Host: ${Smtp__Host}
      Smtp__Port: ${Smtp__Port:-2525}
      Smtp__Username: ${Smtp__Username}
      Smtp__Password: ${Smtp__Password}
      Smtp__From: ${Smtp__From:-noreply@litxus.com}
      Smtp__FromName: ${Smtp__FromName:-PSMPE Portal}
      Seed__Enabled: ${Seed__Enabled:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      OpenAI__ApiKey: ${OpenAI__ApiKey}
      OpenAI__Model: ${OpenAI__Model:-gpt-4o-mini}
      Cache__Enabled: ${Cache__Enabled:-true}
      Cache__ContentDurationSeconds: ${Cache__ContentDurationSeconds:-300}
      Cache__LayoutDurationSeconds: ${Cache__LayoutDurationSeconds:-300}
      Cache__GracePeriodDurationSeconds: ${Cache__GracePeriodDurationSeconds:-600}
      # Every value below uses the ${VAR:-default} form deliberately. Without the colon, a blank
      # line in .env injects an empty string rather than falling back - and a blank
      # ForwardedHeaders__KnownNetworks is the one value that fails *open*, leaving the app
      # trusting X-Forwarded-For from any peer on the internet.
      RateLimit__Enabled: ${RateLimit__Enabled:-true}
      RateLimit__AuthIp__PermitLimit: ${RateLimit__AuthIp__PermitLimit:-20}
      RateLimit__AuthIp__WindowMinutes: ${RateLimit__AuthIp__WindowMinutes:-5}
      RateLimit__AuthEmailSend__PermitLimit: ${RateLimit__AuthEmailSend__PermitLimit:-10}
      RateLimit__AuthEmailSend__WindowMinutes: ${RateLimit__AuthEmailSend__WindowMinutes:-60}
      RateLimit__UsernameProbe__PermitLimit: ${RateLimit__UsernameProbe__PermitLimit:-30}
      RateLimit__UsernameProbe__WindowMinutes: ${RateLimit__UsernameProbe__WindowMinutes:-1}
      RateLimit__Global__PermitLimit: ${RateLimit__Global__PermitLimit:-300}
      RateLimit__Global__WindowMinutes: ${RateLimit__Global__WindowMinutes:-1}
      RateLimit__EmailSendPerAddress__PermitLimit: ${RateLimit__EmailSendPerAddress__PermitLimit:-3}
      RateLimit__EmailSendPerAddress__WindowMinutes: ${RateLimit__EmailSendPerAddress__WindowMinutes:-60}
      Lockout__MaxFailedAttempts: ${Lockout__MaxFailedAttempts:-5}
      Lockout__MinutesLockedOut: ${Lockout__MinutesLockedOut:-15}
      ForwardedHeaders__KnownNetworks: ${ForwardedHeaders__KnownNetworks:-172.16.0.0/12}
    ports:
      - "5000:8080"
    volumes:
      - uploads_data:/app/wwwroot/uploads

  frontend:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  uploads_data:
